# SonarQube configuration — Ooredoo FSM frontend.
#
# Two separate SonarQube projects (backend/frontend), not one monorepo
# project — see SONAR.md at the repo root (Pfe/) for the decision and why:
# these are two independent git repositories with independent lifecycles,
# not a monorepo.
#
# Never hardcode sonar.host.url / sonar.token here. Pass them as CLI args
# or environment variables:
#   npx sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"

sonar.projectKey=ooredoo-frontend
sonar.projectName=Ooredoo FSM - Frontend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts

# Generated/vendor/build output plus test files (tests are covered via
# sonar.tests/sonar.test.inclusions above, not sonar.sources analysis) and
# the two git-ignored, environment-specific files that don't exist in a
# fresh checkout unless a developer has run `npm run env:setup`.
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,.angular/**,src/**/*.spec.ts,src/environments/environment.development.ts,src/environments/environment.production.ts,src/assets/**

# CoreUI template scaffolding (demo/doc pages, not application code) —
# excluded from duplication detection only; still analyzed for real bugs.
sonar.cpd.exclusions=src/app/views/base/**,src/app/views/buttons/**,src/app/views/charts/**,src/app/views/forms/**,src/app/views/notifications/**,src/app/views/widgets/**,src/components/**

sonar.javascript.lcov.reportPaths=coverage/coreui-free-angular-admin-template/lcov.info

sonar.sourceEncoding=UTF-8
