<!--sidebar-->
<c-sidebar
  #sidebar1="cSidebar"
  class="d-print-none sidebar sidebar-fixed border-end"
  colorScheme="dark"
  id="sidebar1"
  visible
>
  <c-sidebar-header class="border-bottom">
    <c-sidebar-brand [routerLink]="[]" class="app-sidebar-brand">
      <span class="sidebar-brand-full app-sidebar-brand__full">
        <img
          [attr.alt]="'app.brandAlt' | transloco"
          class="app-sidebar-brand__logo"
          src="assets/images/Ooredoo-Tunisie.png"
        />
        <span class="app-sidebar-brand__text">
          <span class="app-sidebar-brand__title">{{ 'app.brandName' | transloco }}</span>
          <span class="app-sidebar-brand__subtitle">{{ 'app.brandSubtitle' | transloco }}</span>
        </span>
      </span>
      <span class="sidebar-brand-narrow app-sidebar-brand__narrow">
        <img
          [attr.alt]="'app.brandAlt' | transloco"
          class="app-sidebar-brand__logo app-sidebar-brand__logo--narrow"
          src="assets/images/Ooredoo-Tunisie.png"
        />
      </span>
    </c-sidebar-brand>
  </c-sidebar-header>

  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="close" compact />
  </ng-scrollbar>

  @if (!sidebar1.narrow) {
    <c-sidebar-footer cSidebarToggle="sidebar1" class="border-top d-none d-lg-flex" toggle="unfoldable" style="cursor: pointer;">
      <button cSidebarToggler [attr.aria-label]="'header.toggleSidebar' | transloco"></button>
    </c-sidebar-footer>
  }
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100">
  <!--app-header-->
  <app-default-header
    [cShadowOnScroll]="'sm'"
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky"
    sidebarId="sidebar1"
  />
  <!--app-body-->
  <div class="body flex-grow-1">
    <c-container breakpoint="lg" class="h-auto px-4">
      <router-outlet />
    </c-container>
  </div>
  <app-notification-toast-stack />
  <!--app footer-->
  <app-default-footer />
</div>
