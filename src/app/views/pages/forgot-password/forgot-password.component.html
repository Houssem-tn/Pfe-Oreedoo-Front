<div class="auth-page min-vh-100 d-flex align-items-center">
  <div class="auth-page__lang">
    <app-language-selector variant="header" />
  </div>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-card__brand">
        <img src="assets/images/Ooredoo-Tunisie.png" alt="Ooredoo" class="auth-card__brand-logo" />
        <span class="auth-card__brand-title">ooredoo</span>
      </div>

      <div class="auth-card__intro">
        <span class="auth-card__kicker">{{ 'forgotPassword.kicker' | transloco }}</span>
        <h1 class="auth-card__title">{{ 'forgotPassword.title' | transloco }}</h1>
        <p class="auth-card__subtitle">{{ 'forgotPassword.subtitle' | transloco }}</p>
      </div>

      <!-- Generic success: identical regardless of whether the account exists. -->
      <div *ngIf="success" class="auth-alert auth-alert--success" role="status" aria-live="polite">
        {{ 'forgotPassword.genericSuccess' | transloco }}
      </div>

      <form *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()" novalidate class="auth-form">
        <div *ngIf="errorMessage" class="auth-alert auth-alert--error" role="alert" aria-live="assertive">
          {{ errorMessage }}
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="fp-email">{{ 'forgotPassword.emailLabel' | transloco }}</label>
          <input
            #emailInput
            id="fp-email"
            type="email"
            class="auth-field__control"
            formControlName="email"
            autocomplete="email"
            inputmode="email"
            [attr.aria-invalid]="emailCtrl.touched && emailCtrl.invalid"
            [attr.aria-describedby]="emailError() ? 'fp-email-error' : null"
            [placeholder]="'forgotPassword.emailPlaceholder' | transloco"
          />
          <p *ngIf="emailError()" id="fp-email-error" class="auth-field__error" aria-live="polite">
            {{ emailError() }}
          </p>
        </div>

        <button type="submit" class="auth-submit" [disabled]="loading">
          <span *ngIf="!loading">{{ 'forgotPassword.submit' | transloco }}</span>
          <span *ngIf="loading">{{ 'forgotPassword.loading' | transloco }}</span>
        </button>
      </form>

      <div class="auth-card__footer">
        <a routerLink="/login" class="auth-link">{{ 'forgotPassword.backToLogin' | transloco }}</a>
      </div>
    </div>
  </div>
</div>
