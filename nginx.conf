server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's own configured ceiling
    # (spring.servlet.multipart.max-request-size=120MB in application.properties)
    # so nginx never rejects something the backend would otherwise accept —
    # and is never "unlimited".
    client_max_body_size 120m;

    server_tokens off;

    # Baseline security headers. No CSP here: this app loads MapTiler tiles,
    # SockJS, and Angular's runtime — a correct CSP allowlist needs to be
    # derived from a real browser session (network tab) and verified, not
    # guessed; see DOCKER.md "Known limitations" for this as a documented
    # follow-up rather than shipping an unverified policy that could
    # silently break the map or websocket features.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # index.html must always be revalidated so a redeploy's new hashed
    # bundle references are picked up immediately — never cache it
    # aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # outputHashing:"all" (angular.json) means every built .js/.css filename
    # already changes on content change — safe to cache for a long time,
    # immutably.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # src/assets is copied through as-is (not content-hashed), so it can be
    # replaced on redeploy without a filename change — moderate cache only.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback: any route Angular's router owns falls back to
    # index.html instead of a raw 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API reverse proxy. No path rewrite: the frontend already calls
    # /api/v1/... and the backend maps requestMatchers on the same
    # /api/v1/... paths (see SecurityConfig.java) — proxy_pass with no URI
    # component forwards the request URI unchanged.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Native STOMP-over-WebSocket endpoint (WebSocketConfig#registerStompEndpoints:
    # "/ws-notifications", no SockJS). Upgrade/Connection headers are what
    # actually turn this into a WebSocket proxy instead of a plain HTTP
    # proxy; a long read timeout keeps nginx from closing an idle-but-alive
    # connection out from under the STOMP heartbeat.
    location /ws-notifications {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SockJS fallback endpoint ("/ws-notifications-sockjs", withSockJS()).
    # SockJS opens several sub-paths under this prefix (info, xhr_streaming,
    # websocket, iframe.html, ...); only some of them are real WebSocket
    # upgrades, but sending Upgrade/Connection headers unconditionally is
    # harmless for the plain HTTP transports (nginx only switches to
    # upgrade behavior when the client actually sends the Upgrade header).
    location /ws-notifications-sockjs {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend container's own health check — static file, no proxying, so
    # it reflects "nginx is serving" without depending on the backend being
    # up too (that distinction matters for docker-compose depends_on).
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
